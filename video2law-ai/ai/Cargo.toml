[package]
name = "ai"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
cpal = "0.18.2"
engine = { version = "0.1.0", path = "../engine" }
image = "0.25"
serde_json = "1.0.154"
tokenizers = "0.21.4"
tts = "0.26.3"
ureq = { version = "2", features = ["json"] }

[features]
# GPU: `cargo build --features cuda` (needs the CUDA Toolkit installed). Without it, CPU.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
